<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO DO LIST</title>
    <link rel="stylesheet" href="bootstrap.min.css">
</head>

<body>



        <div class="container-fluid mt-2 p-5 bg-primary text-white text-center w-100 rounded-5>
            <h1>TO DO LIST</h1>




            <div id ="container">


                <div id="inputContainer" class="align-items-center justify-content-center">

                    <button class="bt-sm rounded-2" id="addTaskButton">Add Task</button>
                    <button class="bt-sm rounded-2" id="clearAllButton">Clear All</button>
                </div>

                <ul class="list-group-horizontal text-start" id="taskList">


                </ul>




            </div>
        </div>










    <script src="./todolist.js"></script>
